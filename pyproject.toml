[project]
name = "colab-cli"
version = "0.1.0"
description = "A command-line wrapper for Google Colab's MCP bridge"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Alan" },
]
dependencies = [
    "anyio>=4.5",
    "fastmcp==2.14.5",
    "mcp[cli]>=1.20.0",
    "pydantic>=2.12.3,<3.0.0",
    "websockets>=15.0.1",
]

[project.scripts]
colab-cli = "colab_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
